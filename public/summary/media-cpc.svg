<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="50%" stop-color="#B9893B"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coinFill" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F8E6B4" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#C19042" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#76551F" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="42" rx="38" ry="22" fill="url(#glow)" opacity="0.55"/>
  <!-- Stacked coins -->
  <g>
    <!-- Back coin (slightly offset) -->
    <ellipse cx="34" cy="60" rx="14" ry="3" fill="url(#g)" opacity="0.4"/>
    <ellipse cx="34" cy="56" rx="14" ry="3.2" stroke="url(#g)" stroke-width="0.7" fill="rgba(10,33,23,.5)" opacity="0.75"/>
    <ellipse cx="34" cy="52" rx="14" ry="3.2" stroke="url(#g)" stroke-width="0.7" fill="rgba(10,33,23,.5)" opacity="0.75"/>
    <!-- Front large coin -->
    <circle cx="56" cy="40" r="16" fill="url(#coinFill)" stroke="url(#g)" stroke-width="1.6" opacity="0.95"/>
    <circle cx="56" cy="40" r="13" stroke="#D6B46C" stroke-width="0.4" fill="none" opacity="0.6"/>
    <!-- $ glyph -->
    <text x="56" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600"
      fill="url(#g)" text-anchor="middle" opacity="0.95" stroke="#F4E0A4" stroke-width="0.3">$</text>
    <!-- Notch marks around coin edge -->
    <g stroke="#D6B46C" stroke-width="0.5" opacity="0.6">
      <line x1="56" y1="22" x2="56" y2="24"/>
      <line x1="56" y1="56" x2="56" y2="58"/>
      <line x1="38" y1="40" x2="40" y2="40"/>
      <line x1="72" y1="40" x2="74" y2="40"/>
    </g>
  </g>
  <!-- Tiny rising arrow indicator -->
  <g opacity="0.7">
    <path d="M82 24 L88 16 L94 24" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="88" y1="16" x2="88" y2="32" stroke="url(#g)" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <!-- Brass underline -->
  <line x1="18" y1="70" x2="82" y2="70" stroke="url(#g)" stroke-width="0.5" opacity="0.5"/>
</svg>
