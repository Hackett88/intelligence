<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="50%" stop-color="#B9893B"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(28,56,38,.7)"/>
      <stop offset="100%" stop-color="rgba(8,22,14,.95)"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="42" rx="36" ry="20" fill="url(#glow)" opacity="0.6"/>
  <!-- Heraldic shield -->
  <path d="M50 10 C66 12 78 14 80 16 L80 38 C80 54 68 64 50 72 C32 64 20 54 20 38 L20 16 C22 14 34 12 50 10 Z"
    fill="url(#shieldFill)" stroke="url(#g)" stroke-width="1.6" opacity="0.95"/>
  <!-- Inner trace -->
  <path d="M50 14 C64 16 74 18 76 19 L76 38 C76 51 66 60 50 67 C34 60 24 51 24 38 L24 19 C26 18 36 16 50 14 Z"
    stroke="#D6B46C" stroke-width="0.5" fill="none" opacity="0.55"/>
  <!-- Central cross + diamond ward -->
  <g stroke="url(#g)" stroke-width="1.2" opacity="0.92">
    <line x1="50" y1="22" x2="50" y2="56"/>
    <line x1="34" y1="38" x2="66" y2="38"/>
  </g>
  <path d="M50 32 L56 38 L50 44 L44 38 Z" fill="url(#g)" stroke="#F4E0A4" stroke-width="0.4" opacity="0.95"/>
  <!-- Rivet dots at shield corners -->
  <g fill="#E4CB87" opacity="0.85">
    <circle cx="28" cy="20" r="1"/>
    <circle cx="72" cy="20" r="1"/>
    <circle cx="50" cy="62" r="1"/>
  </g>
  <!-- Latin motto crest -->
  <path d="M40 8 L60 8" stroke="url(#g)" stroke-width="0.6" opacity="0.55"/>
  <circle cx="40" cy="8" r="0.8" fill="#E4CB87"/>
  <circle cx="60" cy="8" r="0.8" fill="#E4CB87"/>
</svg>
