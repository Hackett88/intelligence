    <line x1="26" y1="14" x2="26" y2="25"/>
    <line x1="74" y1="14" x2="74" y2="25"/>
    <line x1="22" y1="28" x2="22" y2="39"/>
    <line x1="78" y1="28" x2="78" y2="39"/>
    <line x1="28" y1="42" x2="28" y2="53"/>
    <line x1="72" y1="42" x2="72" y2="53"/>
    <line x1="24" y1="56" x2="24" y2="67"/>
    <line x1="76" y1="56" x2="76" y2="67"/>
