    <circle cx="36" cy="33.5" r="0.9"/><circle cx="44" cy="33.5" r="0.9"/><circle cx="52" cy="33.5" r="0.9"/><circle cx="60" cy="33.5" r="0.9"/><circle cx="68" cy="33.5" r="0.9"/>
    <circle cx="40" cy="47.5" r="0.9"/><circle cx="48" cy="47.5" r="0.9"/><circle cx="56" cy="47.5" r="0.9"/><circle cx="64" cy="47.5" r="0.9"/>
    <circle cx="38" cy="61.5" r="0.9"/><circle cx="46" cy="61.5" r="0.9"/><circle cx="54" cy="61.5" r="0.9"/><circle cx="62" cy="61.5" r="0.9"/><circle cx="70" cy="61.5" r="0.9"/>
