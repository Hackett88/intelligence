<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="50%" stop-color="#B9893B"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="40" rx="40" ry="22" fill="url(#glow)" opacity="0.55"/>
  <!-- 4 stacked tomes representing a vocabulary library -->
  <g stroke="url(#g)" stroke-width="1.4" fill="rgba(10,33,23,.45)" opacity="0.88">
    <rect x="16" y="14" width="68" height="11" rx="1.2"/>
