<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="50%" stop-color="#B9893B"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="42" rx="38" ry="22" fill="url(#glow)" opacity="0.55"/>
  <!-- Magnifying lens on left -->
  <g transform="translate(28 38)">
    <circle r="14" stroke="url(#g)" stroke-width="1.6" fill="rgba(10,33,23,.5)"/>
    <circle r="11" stroke="#D6B46C" stroke-width="0.5" fill="none" opacity="0.55"/>
    <path d="M-7 -7 C-3 -10 3 -10 6 -6" stroke="#FFF4C8" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>
    <!-- Handle -->
    <line x1="10" y1="10" x2="22" y2="22" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <line x1="11" y1="11" x2="22" y2="22" stroke="#FFE3A0" stroke-width="0.6" opacity="0.5"/>
  </g>
  <!-- Bar chart waveform on right -->
  <g opacity="0.9">
    <rect x="62" y="46" width="3.2" height="14" fill="url(#g)" opacity="0.75"/>
    <rect x="68" y="38" width="3.2" height="22" fill="url(#g)" opacity="0.85"/>
    <rect x="74" y="28" width="3.2" height="32" fill="url(#g)" opacity="0.95"/>
    <rect x="80" y="42" width="3.2" height="18" fill="url(#g)" opacity="0.7"/>
    <rect x="86" y="34" width="3.2" height="26" fill="url(#g)" opacity="0.8"/>
    <line x1="60" y1="62" x2="92" y2="62" stroke="url(#g)" stroke-width="0.5" opacity="0.55"/>
  </g>
  <!-- Search ripples around lens -->
  <g stroke="#D6B46C" stroke-width="0.4" fill="none" opacity="0.45">
    <path d="M5 32 Q10 30 8 28"/>
    <path d="M3 42 Q8 42 5 46"/>
    <path d="M7 50 Q12 48 10 44"/>
  </g>
  <!-- Caret indicator -->
  <path d="M50 12 L52 16 L48 16 Z" fill="url(#g)" opacity="0.7"/>
</svg>
