<svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="50%" stop-color="#B9893B"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="42" rx="36" ry="20" fill="url(#glow)" opacity="0.45"/>
  <!-- A blank scroll / unscored ledger: dashed outline + dotted lines + hourglass -->
  <g stroke="url(#g)" stroke-width="0.9" fill="none" stroke-dasharray="2.5 2.5" opacity="0.7">
    <rect x="14" y="14" width="72" height="52" rx="3"/>
  </g>
  <!-- Three empty entry rows -->
  <g stroke="#D6B46C" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.55">
    <line x1="22" y1="28" x2="78" y2="28"/>
    <line x1="22" y1="40" x2="78" y2="40"/>
    <line x1="22" y1="52" x2="64" y2="52"/>
  </g>
  <!-- Central hourglass / awaiting symbol -->
  <g transform="translate(50 40)" opacity="0.85">
    <path d="M-7 -10 L7 -10 L-7 10 L7 10 Z" stroke="url(#g)" stroke-width="1.1" fill="rgba(10,33,23,.4)"/>
    <path d="M-5.5 -9 L5.5 -9 L-5.5 9 L5.5 9 Z" stroke="#D6B46C" stroke-width="0.4" fill="none" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.4" fill="#FFE3A0" opacity="0.85"/>
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="url(#g)" stroke-width="1.1"/>
    <line x1="-9" y1="12" x2="9" y2="12" stroke="url(#g)" stroke-width="1.1"/>
  </g>
  <!-- Corner sparks (still pending) -->
  <circle cx="14" cy="14" r="0.8" fill="#E4CB87" opacity="0.5"/>
  <circle cx="86" cy="14" r="0.8" fill="#E4CB87" opacity="0.5"/>
  <circle cx="14" cy="66" r="0.8" fill="#E4CB87" opacity="0.5"/>
  <circle cx="86" cy="66" r="0.8" fill="#E4CB87" opacity="0.5"/>
