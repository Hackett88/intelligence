<svg width="1000" height="760" viewBox="0 0 1000 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DE9A"/>
      <stop offset="34%" stop-color="#B9893B"/>
      <stop offset="67%" stop-color="#F3DA91"/>
      <stop offset="100%" stop-color="#76551F"/>
    </linearGradient>
    <linearGradient id="softGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9AE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C19042" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E6B4" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#C4A96B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7FB68B" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A6" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#D3A94F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#062016" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      .line{stroke:url(#gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.88}
      .thin{stroke:url(#softGold);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.58}
      .hair{stroke:#D6B46C;stroke-width:.75;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.32}
      .node{fill:#0A2117;fill-opacity:.58;stroke:#B98A3E;stroke-width:1.2;opacity:.92}
      .card{fill:#0A2117;fill-opacity:.38;stroke:url(#gold);stroke-width:1.6;opacity:.9}
      .label{font-family:Georgia, 'Times New Roman', serif;font-size:18px;letter-spacing:2.4px;fill:#DCC078;opacity:.9}
      .cn{font-family:'Noto Serif SC','Songti SC','SimSun',serif;font-size:21px;letter-spacing:1px;fill:#E4CB87;opacity:.88}
      .small{font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:1.5px;fill:#D7B96D;opacity:.66}
      .tiny{font-family:Georgia,'Times New Roman',serif;font-size:11px;letter-spacing:1.1px;fill:#D0AC5C;opacity:.55}
    </style>
  </defs>

  <!-- ambient vertical light and central glow -->
  <path d="M470 0 L550 0 L506 760 L422 760 Z" fill="#FFF1BA" opacity="0.045" filter="url(#softBlur)"/>
  <ellipse cx="500" cy="540" rx="310" ry="130" fill="url(#centerGlow)" opacity="0.56"/>

  <!-- background content architecture grid -->
  <g opacity="0.48">
    <path class="hair" d="M72 590 C220 532 330 564 500 512 C660 462 780 486 932 420"/>
    <path class="hair" d="M60 632 C210 585 330 618 500 558 C668 500 804 526 948 478"/>
    <path class="hair" d="M100 336 C248 296 376 314 504 280 C648 242 780 246 932 202"/>
    <path class="hair" d="M110 394 C270 356 392 370 510 332 C638 292 782 296 916 260"/>
    <circle cx="208" cy="552" r="2" fill="#E4C87A" opacity=".55"/>
    <circle cx="500" cy="512" r="2.3" fill="#E4C87A" opacity=".68"/>
    <circle cx="780" cy="486" r="2" fill="#E4C87A" opacity=".55"/>
  </g>

  <!-- orbital platform -->
  <g transform="translate(500 548)" opacity="0.82">
    <ellipse class="thin" cx="0" cy="0" rx="258" ry="68"/>
    <ellipse class="thin" cx="0" cy="0" rx="178" ry="46"/>
    <ellipse class="thin" cx="0" cy="0" rx="94" ry="24"/>
    <ellipse cx="0" cy="0" rx="50" ry="12" fill="#F8D98D" opacity="0.13"/>
    <circle cx="0" cy="0" r="4" fill="#FFE5A0" filter="url(#glow)"/>
  </g>

  <!-- top keyword search capsule -->
  <g filter="url(#glow)">
    <rect x="388" y="102" width="224" height="42" rx="21" class="node"/>
    <text class="cn" x="452" y="130">关键词</text>
    <circle cx="569" cy="122" r="8" class="thin"/>
    <path class="thin" d="M575 128 L585 138"/>
  </g>

  <!-- intent recognition node -->
  <g>
    <path class="line" d="M500 144 C500 176 500 190 500 216"/>
    <rect x="412" y="216" width="176" height="42" rx="21" class="node"/>
    <text class="cn" x="445" y="244">意图识别</text>
  </g>

  <!-- branching lines from intent to four intent nodes -->
  <g>
    <path class="line" d="M500 258 C500 294 500 302 500 322"/>
    <path class="line" d="M500 322 C372 322 274 342 220 390"/>
    <path class="line" d="M500 322 C420 332 362 354 326 390"/>
    <path class="line" d="M500 322 C580 332 638 354 674 390"/>
    <path class="line" d="M500 322 C628 322 726 342 780 390"/>
    <circle cx="500" cy="322" r="5" fill="#FFE1A0" filter="url(#glow)"/>
  </g>

  <!-- intent nodes -->
  <g>
    <g transform="translate(220 414)">
      <circle r="44" class="node"/>
      <path class="thin" d="M-17 -8 H17 M-17 4 H11 M-17 16 H4"/>
      <text class="cn" x="-31" y="66">信息型</text>
      <text class="tiny" x="-51" y="84">INFORMATIONAL</text>
    </g>
    <g transform="translate(326 414)">
      <circle r="44" class="node"/>
      <path class="thin" d="M-14 15 V-15 H14 V15 Z M-6 -5 H8 M-6 5 H8"/>
      <text class="cn" x="-31" y="66">导航型</text>
      <text class="tiny" x="-49" y="84">NAVIGATIONAL</text>
    </g>
    <g transform="translate(674 414)">
      <circle r="44" class="node"/>
      <path class="thin" d="M-18 -10 H18 L12 15 H-12 Z M-8 22 H-8 M10 22 H10"/>
      <text class="cn" x="-31" y="66">交易型</text>
      <text class="tiny" x="-51" y="84">TRANSACTIONAL</text>
    </g>
    <g transform="translate(780 414)">
      <circle r="44" class="node"/>
      <path class="thin" d="M-18 14 L-4 -8 L8 4 L18 -16 M-18 14 H18"/>
      <text class="cn" x="-52" y="66">商业调查型</text>
      <text class="tiny" x="-45" y="84">COMMERCIAL</text>
    </g>
  </g>

  <!-- flows from intent nodes to content output cards -->
  <g opacity="0.9">
    <path class="line" d="M220 458 C206 494 188 514 164 538"/>
    <path class="line" d="M326 458 C330 494 342 514 362 538"/>
    <path class="line" d="M674 458 C670 494 658 514 638 538"/>
    <path class="line" d="M780 458 C794 494 812 514 836 538"/>
  </g>

  <!-- output cards -->
  <g>
    <g transform="translate(86 538)">
      <rect width="156" height="164" rx="12" class="card"/>
      <text class="cn" x="38" y="34">博客文章</text>
      <text class="small" x="39" y="53">BLOG POST</text>
      <rect x="26" y="72" width="104" height="16" rx="3" class="thin"/>
      <path class="hair" d="M26 108 H126 M26 126 H116 M26 144 H98"/>
      <circle cx="42" cy="88" r="2" fill="#F3D083"/>
    </g>
    <g transform="translate(294 538)">
      <rect width="156" height="164" rx="12" class="card"/>
      <text class="cn" x="37" y="34">指南/教程</text>
      <text class="small" x="55" y="53">GUIDE</text>
      <path class="thin" d="M34 76 H122 M34 96 H122 M34 116 H94"/>
      <rect x="34" y="132" width="38" height="20" rx="4" class="thin"/>
      <rect x="84" y="132" width="38" height="20" rx="4" class="thin"/>
    </g>
    <g transform="translate(550 538)">
      <rect width="156" height="164" rx="12" class="card"/>
      <text class="cn" x="26" y="34">产品/服务页</text>
      <text class="small" x="25" y="53">PRODUCT PAGE</text>
      <rect x="28" y="72" width="100" height="46" rx="8" class="thin"/>
      <path class="hair" d="M40 134 H116 M40 150 H94"/>
      <circle cx="78" cy="95" r="12" class="thin"/>
    </g>
    <g transform="translate(758 538)">
      <rect width="156" height="164" rx="12" class="card"/>
      <text class="cn" x="35" y="34">对比/评测</text>
      <text class="small" x="33" y="53">COMPARISON</text>
      <path class="thin" d="M44 74 V146 M110 74 V146 M28 92 H128 M28 120 H128"/>
      <path class="hair" d="M42 102 L56 114 L78 86 M104 130 L118 142 L140 104"/>
    </g>
  </g>

  <!-- side SERP distribution ornaments -->
  <g opacity="0.52">
    <rect x="70" y="174" width="144" height="34" rx="8" class="thin"/>
    <path class="hair" d="M92 191 H188"/>
    <rect x="786" y="174" width="144" height="34" rx="8" class="thin"/>
    <path class="hair" d="M806 191 H908"/>
    <path class="hair" d="M105 244 H210 M105 266 H178 M105 288 H194"/>
    <path class="hair" d="M790 244 H895 M824 266 H895 M806 288 H895"/>
  </g>

  <!-- tiny spark marks -->
  <g filter="url(#glow)">
    <circle cx="398" cy="188" r="2" fill="#FFE3A0" opacity=".55"/>
    <circle cx="603" cy="188" r="2" fill="#FFE3A0" opacity=".55"/>
    <circle cx="500" cy="490" r="2.4" fill="#FFE3A0" opacity=".75"/>
    <circle cx="130" cy="504" r="1.8" fill="#FFE3A0" opacity=".45"/>
    <circle cx="870" cy="504" r="1.8" fill="#FFE3A0" opacity=".45"/>
    <path d="M455 82 L465 82 M460 77 L460 87" stroke="#FFE3A0" stroke-width="1" opacity=".45"/>
    <path d="M540 314 L552 314 M546 308 L546 320" stroke="#FFE3A0" stroke-width="1" opacity=".42"/>
  </g>
</svg>
